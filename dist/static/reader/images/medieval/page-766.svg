<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1536" role="img" aria-labelledby="title desc">
  <title id="title">Registro da enfermaria do leste</title>
  <desc id="desc">Uma ficha de atendimento registra a ferida de Pim, a extração de uma fibra, o uso supervisionado de água e a necessidade de curativo e repouso.</desc>
  <defs>
    <linearGradient id="desk" x2="1" y2="1"><stop stop-color="#34261b"/><stop offset=".52" stop-color="#60402c"/><stop offset="1" stop-color="#251c17"/></linearGradient>
    <radialGradient id="light"><stop stop-color="#efc17a" stop-opacity=".35"/><stop offset="1" stop-color="#efc17a" stop-opacity="0"/></radialGradient>
    <linearGradient id="paper" x2=".1" y2="1"><stop stop-color="#f5e8c9"/><stop offset=".6" stop-color="#e8d6ae"/><stop offset="1" stop-color="#d9bb87"/></linearGradient>
    <pattern id="wood" width="86" height="1536" patternUnits="userSpaceOnUse"><path d="M5 0C22 306-1 730 14 1536M54 0c-11 393 25 820 3 1536M82 0c12 480-9 1004 4 1536" fill="none" stroke="#ba8759" stroke-opacity=".11" stroke-width="4"/></pattern>
    <filter id="shadow"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1024" height="1536" fill="url(#desk)"/>
  <rect width="1024" height="1536" fill="url(#wood)"/>
  <ellipse cx="170" cy="130" rx="740" ry="550" fill="url(#light)"/>
  <path d="M85 78h855v1378H85z" fill="#090807" opacity=".48" filter="url(#shadow)"/>
  <path d="M98 66L918 84l-15 1360-813-18z" fill="url(#paper)" stroke="#8c613e" stroke-width="6"/>
  <path d="M126 101l762 17-11 1288-757-17z" fill="none" stroke="#967248" stroke-opacity=".66" stroke-width="3"/>
  <path d="M167 215h666M171 277h661M165 655h668M160 1117h666" stroke="#866440" stroke-width="3" opacity=".72"/>
  <g fill="#38271e" font-family="Georgia, serif" text-anchor="middle">
    <text x="511" y="159" font-size="26" letter-spacing="5">CASA DAS QUATRO LUAS</text>
    <text x="511" y="205" font-size="43" font-weight="bold">Registro da enfermaria</text>
    <text x="512" y="256" font-size="23" letter-spacing="3">ALA LESTE  ·  DIA 487</text>
  </g>
  <g font-family="Georgia, serif" fill="#32241c">
    <text x="174" y="351" font-size="32" font-weight="bold">Paciente  ·  Pim</text>
    <text x="174" y="402" font-size="25">Ofício: redes e cordas da eclusa</text>
    <text x="174" y="469" font-size="25">Ferida na palma por atrito de corda molhada.</text>
    <text x="174" y="510" font-size="25">Uma fibra permaneceu sob a crosta.</text>
    <text x="174" y="582" font-size="26">A água limpa revelou a fibra.</text>
    <text x="174" y="624" font-size="26">A curandeira a retirou com pinça.</text>
  </g>
  <g transform="translate(515 866)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle r="169" stroke="#9c7850" stroke-width="3"/>
    <circle r="156" stroke="#9c7850" stroke-width="1"/>
    <path d="M-94 29c13-20 48-21 75-14l43 18 62-37c18-10 35 6 19 21L36 78c-20 16-41 25-63 25h-56l-31 20" stroke="#513a2a" stroke-width="13"/>
    <path d="M-8 15l-24-82c-6-26 14-38 27-19L27-8M18 18L23-91c2-25 29-27 34-3l1 79M58 11l27-74c9-23 33-17 31 5L101 8" stroke="#513a2a" stroke-width="12"/>
    <path d="M-82 49h103M-72 67h99M-67 83h77" stroke="#8f6c49" stroke-width="6"/>
    <path d="M21 37c12-14 25-19 42-18" stroke="#992f2b" stroke-width="5"/>
    <path d="M66 14l41-29" stroke="#992f2b" stroke-width="3" stroke-dasharray="7 7"/>
  </g>
  <g font-family="Georgia, serif" fill="#32241c" font-size="25">
    <text x="174" y="1082">Conduta: curativo limpo e repouso.</text>
    <text x="174" y="1155">Sem trabalho com cordas por alguns dias.</text>
    <text x="174" y="1224">Revisar sangramento e cicatrização.</text>
    <text x="174" y="1306" font-size="22" font-style="italic">Água auxilia o cuidado; não fecha a carne.</text>
  </g>
  <path d="M670 1360c55-13 113-5 153 8" fill="none" stroke="#704d32" stroke-width="4"/>
  <circle cx="815" cy="1365" r="36" fill="#923e36" stroke="#622722" stroke-width="5"/>
  <path d="M795 1365h39m-19-19v39" stroke="#d6ac79" stroke-width="3" opacity=".8"/>
</svg>
