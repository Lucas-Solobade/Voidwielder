<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title">
  <title id="title">Fluxograma luminoso sobre um editor de código</title>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#1b2741"/><stop offset="1" stop-color="#0d1528"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#3a708c" stop-opacity=".6"/><stop offset="1" stop-color="#3a708c" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#a6d7e3" stroke-opacity=".07"/></pattern>
    <filter id="shadow"><feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity=".4"/></filter>
  </defs>
  <rect width="800" height="560" fill="url(#bg)"/><rect width="800" height="560" fill="url(#grid)"/><circle cx="444" cy="278" r="310" fill="url(#glow)"/>
  <g opacity=".52" fill="none" stroke="#88d9e8" stroke-width="2"><path d="M68 92H182M91 114H156M610 96h110M648 118h56M82 458h122M619 448h98"/></g>
