    <rect x="421" y="324" width="155" height="74" rx="13" fill="#574729" stroke="#ffd65b" stroke-width="2"/><text x="499" y="355" text-anchor="middle" fill="#fff5d1" font-family="Arial,sans-serif" font-size="16" font-weight="700">SAÍDA</text><text x="499" y="378" text-anchor="middle" fill="#ffe7a1" font-family="monospace" font-size="14">print()</text>
