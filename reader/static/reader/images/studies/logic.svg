    <path d="M125 148h550" stroke="#65bad0" stroke-opacity=".34"/><circle cx="156" cy="125" r="6" fill="#ffcc71"/><circle cx="179" cy="125" r="6" fill="#8edbd1"/><circle cx="202" cy="125" r="6" fill="#7884bc"/>
    <path d="M286 196v30m0 69v30m0 73v21m212-218v25m0 69v29" stroke="#86d8db" stroke-width="4" stroke-dasharray="8 8"/>
    <path d="M322 260h76m0 0h24m-27-10 11 10-11 10M499 296v28" fill="none" stroke="#ffd65b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="218" y="170" width="136" height="48" rx="22" fill="#284661" stroke="#7fe0d6" stroke-width="2"/><text x="286" y="201" text-anchor="middle" fill="#e9fbf5" font-family="Arial,sans-serif" font-size="20" font-weight="700">INÍCIO</text>
    <path d="m286 225 71 35-71 35-71-35z" fill="#61513e" stroke="#ffda78" stroke-width="2"/><text x="286" y="266" text-anchor="middle" fill="#fff0c4" font-family="Arial,sans-serif" font-size="17" font-weight="700">SE?</text>
    <rect x="216" y="324" width="140" height="74" rx="13" fill="#263e61" stroke="#8cc5ff" stroke-width="2"/><text x="286" y="354" text-anchor="middle" fill="#e8f6ff" font-family="Arial,sans-serif" font-size="16" font-weight="700">CALCULAR</text><text x="286" y="378" text-anchor="middle" fill="#acd9e7" font-family="monospace" font-size="15">a + b</text>
